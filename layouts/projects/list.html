{{ define "main" }}
<section class="page-hero">
  <div class="container">
    <span class="section-rule"></span>
    <span class="eyebrow">{{ .Params.eyebrow }}</span>
    <h1>{{ .Title }}</h1>
    <p class="lede">{{ .Params.lede }}</p>
  </div>
</section>

<section class="page-section">
  <div class="container">
    <div class="card-grid">
      {{ range .Pages.ByDate.Reverse }}
        {{ partial "project-card.html" . }}
      {{ end }}
    </div>
  </div>
</section>
{{ end }}

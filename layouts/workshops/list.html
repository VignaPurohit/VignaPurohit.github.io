{{ define "main" }}
<section class="page-hero">
  <div class="container">
    <span class="section-rule"></span>
    <span class="eyebrow">{{ .Params.eyebrow }}</span>
    <h1>{{ .Title }}</h1>
    <p class="lede">{{ .Params.lede }}</p>
  </div>
</section>

<section class="page-section page-section--flush">
  <div class="container">
    <div class="workshop-entries">
      {{ range $index, $p := .Pages.ByDate.Reverse }}
        {{ partial "workshop-entry.html" (dict "page" $p "number" (add $index 1)) }}
      {{ end }}
    </div>
  </div>
</section>
{{ end }}

<!DOCTYPE html>
<html lang="en">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "nav.html" . }}

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

  <script>
    (function () {
      var btn = document.getElementById("nav-toggle");
      var menu = document.getElementById("mobile-menu");
      if (!btn || !menu) return;
      btn.addEventListener("click", function () {
        var isOpen = menu.classList.toggle("is-open");
        btn.setAttribute("aria-expanded", isOpen ? "true" : "false");
      });
    })();
  </script>

  <script>
    // Project case-study cards: only show "Read more" on cards whose
    // 12-line-clamped body actually overflows, and expand in place.
    (function () {
      var sections = document.querySelectorAll(".case-section");
      sections.forEach(function (section) {
        var body = section.querySelector(".case-section-body");
        var btn = section.querySelector(".case-read-more");
        if (!body || !btn) return;
        if (body.scrollHeight > body.clientHeight + 1) {
          btn.classList.add("is-visible");
        }
        btn.addEventListener("click", function () {
          var expanded = section.classList.toggle("is-expanded");
          btn.textContent = expanded ? "Show less" : "Read more";
          btn.setAttribute("aria-expanded", expanded ? "true" : "false");
        });
      });
    })();
  </script>

  <script>
    // Report-figure sliding galleries: exactly one slide fills the
    // track at a time; prev/next step to the adjacent slide and a
    // counter ("3 / 20") tracks position, updated on every scroll
    // (button clicks, swipe, or keyboard) via a scroll listener.
    (function () {
      document.querySelectorAll(".image-carousel").forEach(function (carousel) {
        var track = carousel.querySelector(".carousel-track");
        var prev = carousel.querySelector(".carousel-btn--prev");
        var next = carousel.querySelector(".carousel-btn--next");
        var counter = carousel.querySelector(".carousel-counter");
        var slides = carousel.querySelectorAll(".carousel-slide");
        if (!track || !prev || !next || !slides.length) return;

        var updateCounter = function () {
          if (!counter) return;
          var index = Math.round(track.scrollLeft / track.clientWidth);
          counter.textContent = (index + 1) + " / " + slides.length;
        };
        var goTo = function (dir) {
          track.scrollBy({ left: dir * track.clientWidth, behavior: "smooth" });
        };
        prev.addEventListener("click", function () { goTo(-1); });
        next.addEventListener("click", function () { goTo(1); });
        track.addEventListener("scroll", updateCounter, { passive: true });
        updateCounter();
      });
    })();
  </script>
</body>
</html>

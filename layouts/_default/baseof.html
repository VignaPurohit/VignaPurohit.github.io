<!DOCTYPE html>
<html lang="en">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "nav.html" . }}

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

  <script>
    (function () {
      var btn = document.getElementById("nav-toggle");
      var menu = document.getElementById("mobile-menu");
      if (!btn || !menu) return;
      btn.addEventListener("click", function () {
        var isOpen = menu.classList.toggle("is-open");
        btn.setAttribute("aria-expanded", isOpen ? "true" : "false");
      });
    })();
  </script>

  <script>
    // Subtle scroll-reveal for .reveal elements. Progressive
    // enhancement only: without JS, or with reduced motion requested,
    // content is already fully visible (see the base .reveal rule in
    // style.css) — nothing here is required to read the page.
    (function () {
      var prefersReduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (prefersReduced || !("IntersectionObserver" in window)) return;
      document.documentElement.classList.add("js-reveal-ready");
      var items = document.querySelectorAll(".reveal");
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
      items.forEach(function (el) { observer.observe(el); });
    })();
  </script>
</body>
</html>

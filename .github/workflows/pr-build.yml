name: PR Build Check

# Validates that every pull request builds cleanly with Hugo, and
# publishes the built site as a downloadable artifact so changes can
# be inspected before merging. GitHub Pages can only serve one live
# deployment per repository, so this is the practical GitHub-native
# stand-in for a per-PR hosted preview (see README for why).

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

env:
  HUGO_VERSION: 0.166.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build (strict)
        run: hugo --minify --baseURL "https://vignapurohit.github.io/" --printPathWarnings

      - name: Upload built site as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hugo-build-pr-${{ github.event.pull_request.number }}
          path: ./public
          retention-days: 14

      - name: Comment build result on PR
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "✅ **Hugo build succeeded** for this PR.",
              "",
              "GitHub Pages only serves one live deployment per repo, so there's no hosted preview URL — instead, download the built site and open it locally:",
              "",
              `1. Open the [workflow run](${runUrl})`,
              "2. Download the `hugo-build-pr-${{ github.event.pull_request.number }}` artifact (bottom of the summary page)",
              "3. Unzip it and open `index.html`, or serve it locally: `npx serve <unzipped-folder>`",
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = "Hugo build succeeded";
            const existing = comments.find(c => c.user.type === "Bot" && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
